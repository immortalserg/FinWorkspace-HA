name: Generate brand icons

on:
  workflow_dispatch:
  push:
    paths:
      - 'finworkspace/brand/finworkspace.svg'
      - '.github/workflows/brand-icons.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render HA add-on branding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 256 -h 256 finworkspace/brand/finworkspace.svg > finworkspace/icon.png
          rsvg-convert -w 512 -h 512 finworkspace/brand/finworkspace.svg > finworkspace/logo.png
      - name: Commit icons
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add finworkspace/icon.png finworkspace/logo.png
          if ! git diff --cached --quiet; then
            git commit -m "Render FinWorkspace Home Assistant icon and logo"
            git push
          fi
